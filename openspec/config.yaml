schema: spec-driven
version: "1.0"

context: |
  Tech stack: Node.js + Express v5 + Prisma ORM + PostgreSQL
  Architecture: Layered (routes → controllers → services → discountEngine)
  Testing: Manual node scripts (no test framework — tests run with `node tests/...`)
  Style: No linter/formatter configured (vanilla JS, CommonJS modules)
  Auth: JWT (httpOnly cookies) + RBAC middleware

strict_tdd: false
# NOTE: Strict TDD disabled — no test framework (jest/vitest) installed.
# Tests are manual node scripts. Pipeline requires human verification.

rules:
  proposal:
    - Include rollback plan (git revert + DB dump)
    - Identify affected modules and backward-compatible contracts
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document the merge contract between legacy and universal engine outputs
    - Include sequence diagrams for complex flows
  tasks:
    - Group tasks by phase (F0, F1, F2, F3, F4)
    - Use hierarchical numbering (2.1, 2.2, etc.)
    - Each task must be completable in one file-edit session
  apply:
    - Never break the legacy engine — run universal in parallel
    - engineVersion field is the single source of truth for routing
    - Validate dual conditions via validateConditionsDual()
  verify:
    - Run manual node test scripts and confirm output
    - Compare with spec scenarios manually
  archive:
    - Warn before removing legacy evaluators (destructive)

testing:
  strict_tdd: false
  runner:
    framework: manual (node scripts)
    command: "node tests/discountEngine/universal.test.js"
  layers:
    unit:
      available: true
      tool: "node (manual scripts)"
    integration:
      available: false
      tool: "—"
    e2e:
      available: false
      tool: "—"
  coverage:
    available: false
    command: "—"
  quality_tools:
    linter:
      available: false
      command: "—"
    type_checker:
      available: false
      command: "—"
    formatter:
      available: false
      command: "—"
